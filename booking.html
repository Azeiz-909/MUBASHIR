<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>احجز استشارتك | عيادة تحدث</title>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#22322C; --paper:#EFEDE6; --clay:#B8734F; --line:#DAD5C8; }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
  body{background:var(--paper); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .wrap{width:100%; max-width:480px;}
  a.back{display:inline-block; margin-bottom:16px; color:#6b7570; font-size:.88rem;}
  .card{background:#fff; padding:36px 30px; border-radius:20px; box-shadow:0 20px 50px rgba(34,50,44,.1);}
  h1{font-family:'Markazi Text',serif; font-size:1.9rem; margin-bottom:6px;}
  p.sub{color:#6b7570; font-size:.92rem; margin-bottom:26px;}
  label{display:block; font-weight:700; font-size:.88rem; margin-bottom:6px;}
  input, select{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:16px; font-size:.94rem; font-family:inherit; background:#fff;}
  input:focus, select:focus{outline:2px solid var(--clay); border-color:transparent;}
  button{width:100%; padding:14px; background:var(--ink); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:.98rem; cursor:pointer;}
  button:hover{background:var(--clay);}
  .msg{color:#b23a3a; font-size:.85rem; margin-bottom:14px; min-height:18px;}
  .hint{font-size:.8rem; color:#7C8B7A; margin-top:-10px; margin-bottom:16px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← العودة للصفحة الرئيسية</a>
  <form class="card" id="bookingForm">
    <h1>احجز استشارتك</h1>
    <p class="sub">عبّئ بياناتك وسنؤكد لك موعدك فورًا برابط خاص بحجزك.</p>
    <div class="msg" id="msg"></div>

    <label for="name">الاسم</label>
    <input type="text" id="name" required>

    <label for="phone">رقم الجوال</label>
    <input type="tel" id="phone" placeholder="05xxxxxxxx" required>

    <div id="counselorField" style="display:none;">
      <label for="counselor">المستشار</label>
      <select id="counselor"></select>
    </div>

    <label for="date">التاريخ</label>
    <input type="date" id="date" required>

    <label for="time">الوقت</label>
    <input type="time" id="time" required>
    <div class="hint" id="hoursHint"></div>

    <button type="submit">تأكيد الحجز</button>
  </form>
</div>
<script>
let COUNSELORS = [];
(async function(){
  const res = await fetch('/api/content'); const c = await res.json();
  COUNSELORS = c.counselors || [];
  if (COUNSELORS.length > 1) {
    document.getElementById('counselorField').style.display = 'block';
    document.getElementById('counselor').innerHTML = COUNSELORS.map(co => `<option value="${co.id}">${co.name} — ${co.role}</option>`).join('');
  }
  document.getElementById('hoursHint').textContent = 'أوقات العمل: ' + (c.hours||[]).map(h=>`${h.label} (${h.value})`).join(' — ');
})();

document.getElementById('bookingForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent = '';
  const payload = {
    name: document.getElementById('name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    counselorId: COUNSELORS.length > 1 ? document.getElementById('counselor').value : (COUNSELORS[0]?.id || null)
  };
  const res = await fetch('/api/bookings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error || 'حدث خطأ، حاول مجددًا'; return; }
  location.href = '/confirm.html?id=' + data.booking.id;
});
</script>
</body>
</html>
