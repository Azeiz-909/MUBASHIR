<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موعدك | عيادة تحدث</title>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#22322C; --paper:#EFEDE6; --clay:#B8734F; --line:#DAD5C8; }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
  body{background:var(--paper); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .wrap{width:100%; max-width:480px;}
  a.back{display:inline-block; margin-bottom:16px; color:#6b7570; font-size:.88rem;}
  .card{background:#fff; padding:36px 30px; border-radius:20px; box-shadow:0 20px 50px rgba(34,50,44,.1); text-align:center;}
  h1{font-family:'Markazi Text',serif; font-size:1.8rem; margin-bottom:6px;}
  p.sub{color:#6b7570; font-size:.92rem; margin-bottom:22px;}
  .check{width:56px; height:56px; border-radius:50%; background:#e7f3ea; color:#2f8f4e; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin:0 auto 16px;}
  .detail-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:.92rem; text-align:right;}
  .detail-row span:first-child{color:#6b7570;}
  .countdown{margin:24px 0; font-size:1.05rem;}
  .countdown b{font-family:'Markazi Text',serif; font-size:1.6rem; color:var(--clay);}
  .join-btn{width:100%; padding:15px; border:none; border-radius:12px; font-weight:700; font-size:1rem; cursor:pointer; margin-top:10px;}
  .join-btn.disabled{background:#DAD5C8; color:#8a8f87; cursor:not-allowed;}
  .join-btn.enabled{background:var(--clay); color:#fff;}
  .lookup input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:14px; font-size:.94rem;}
  .lookup button{width:100%; padding:13px; background:var(--ink); color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer;}
  .msg{color:#b23a3a; font-size:.85rem; margin-bottom:10px;}
  .access-box{margin-top:20px; text-align:right;}
  .access-item{background:var(--paper); border-radius:12px; padding:14px 16px; margin-bottom:12px;}
  .access-label{font-weight:700; font-size:.9rem; margin-bottom:8px;}
  .access-value-row{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .access-value-row code{flex:1; font-size:.85rem; color:var(--ink); word-break:break-all; direction:ltr; text-align:left;}
  .copy-btn{flex-shrink:0; background:var(--clay); color:#fff; border:none; border-radius:6px; padding:6px 14px; font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap;}
  .copy-btn:hover{background:var(--ink);}
  .access-hint{font-size:.78rem; color:#6b7570; margin-top:8px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← العودة للصفحة الرئيسية</a>
  <div id="app"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const bookingId = params.get('id');
const app = document.getElementById('app');

if (!bookingId) {
  renderLookup();
} else {
  loadBooking(bookingId);
}

function renderLookup(msg){
  app.innerHTML = `
    <div class="card lookup">
      <h1>لديك موعد استشارة عن بُعد؟</h1>
      <p class="sub">أدخل رقم الحجز الذي استلمته عند التأكيد للوصول إلى موعدك.</p>
      ${msg ? `<div class="msg">${msg}</div>` : ''}
      <input type="text" id="idInput" placeholder="رقم الحجز، مثال: a1b2c3d4e5">
      <button id="findBtn">عرض موعدي</button>
    </div>`;
  document.getElementById('findBtn').addEventListener('click', ()=>{
    const val = document.getElementById('idInput').value.trim();
    if (!val) return;
    location.href = '/confirm.html?id=' + encodeURIComponent(val);
  });
}

async function loadBooking(id){
  app.innerHTML = '<div class="card">جارٍ التحميل…</div>';
  const res = await fetch('/api/bookings/' + encodeURIComponent(id));
  if (!res.ok) { renderLookup('لم يتم العثور على حجز بهذا الرقم. تأكد من الرقم وحاول مجددًا.'); return; }
  const b = await res.json();
  const target = new Date(b.date + 'T' + b.time);
  const joinWindowMs = (b.joinWindowMinutes || 20) * 60 * 1000;

  app.innerHTML = `
    <div class="card">
      <div class="check">✓</div>
      <h1>تم تأكيد موعدك</h1>
      <p class="sub">احتفظ برقم الحجز أدناه للوصول إلى جلستك لاحقًا.</p>
      <div class="detail-row"><span>الاسم</span><span>${escapeHtml(b.name)}</span></div>
      <div class="detail-row"><span>المستشار</span><span>${escapeHtml(b.counselorName || 'غير محدد')}</span></div>
      <div class="detail-row"><span>التاريخ</span><span>${escapeHtml(b.date)}</span></div>
      <div class="detail-row"><span>الوقت</span><span>${escapeHtml(b.time)}</span></div>
      <div class="countdown" id="countdownBox"></div>
      <button class="join-btn disabled" id="joinBtn" disabled>دخول الجلسة</button>
      <div id="videoContainer" style="display:none; margin-top:16px;">
        <iframe id="videoFrame" style="width:100%; height:480px; border:0; border-radius:12px;" allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
      </div>
      <div class="access-box">
        <div class="access-item">
          <div class="access-label">🔑 كود حجزك</div>
          <div class="access-value-row">
            <code id="bookingCodeText">${b.id}</code>
            <button class="copy-btn" data-copy-text="${b.id}">نسخ</button>
          </div>
          <p class="access-hint">احتفظ بهذا الكود. للعودة لموعدك لاحقًا، ادخل موقع العيادة واضغط "لديك موعد استشارة عن بُعد؟"، ثم الصق الكود.</p>
        </div>
        <div class="access-item">
          <div class="access-label">🔗 رابط موعدك المباشر</div>
          <div class="access-value-row">
            <code id="bookingLinkText">${location.origin}/confirm.html?id=${b.id}</code>
            <button class="copy-btn" data-copy-text="${location.origin}/confirm.html?id=${b.id}">نسخ</button>
          </div>
          <p class="access-hint">احفظ هذا الرابط. بمجرد الضغط عليه من أي مكان (رسالة، ملاحظات، إلخ) يفتح لك موعدك مباشرة دون أي خطوات إضافية.</p>
        </div>
      </div>
    </div>`;

  function tick(){
    const now = new Date();
    const diff = target - now;
    const box = document.getElementById('countdownBox');
    const btn = document.getElementById('joinBtn');
    if (diff <= joinWindowMs) {
      box.textContent = diff > 0 ? 'يمكنك الآن الدخول إلى جلستك.' : 'موعدك جارٍ الآن.';
      btn.disabled = false; btn.classList.remove('disabled'); btn.classList.add('enabled');
    } else {
      const mins = Math.floor(diff / 60000);
      const hrs = Math.floor(mins / 60);
      const days = Math.floor(hrs / 24);
      let label = days > 0 ? `${days} يوم و${hrs % 24} ساعة` : (hrs > 0 ? `${hrs} ساعة و${mins % 60} دقيقة` : `${mins} دقيقة`);
      box.innerHTML = `يُفتح زر الدخول قبل الموعد بـ ${b.joinWindowMinutes || 20} دقيقة — الوقت المتبقي: <b>${label}</b>`;
      btn.disabled = true; btn.classList.add('disabled'); btn.classList.remove('enabled');
    }
  }
  tick();
  setInterval(tick, 1000);

  document.getElementById('joinBtn').addEventListener('click', ()=>{
    if (document.getElementById('joinBtn').disabled) return;
    if (!b.videoRoomUrl) { alert('لم تُنشأ غرفة الفيديو بعد. حدّث الصفحة بعد قليل، أو تواصل مع العيادة إن استمرت المشكلة.'); return; }
    document.getElementById('joinBtn').style.display = 'none';
    const container = document.getElementById('videoContainer');
    container.style.display = 'block';
    document.getElementById('videoFrame').src = b.videoRoomUrl;
  });
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-copy-text]');
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.dataset.copyText);
    const original = btn.textContent;
    btn.textContent = '✓ تم النسخ';
    setTimeout(() => { btn.textContent = original; }, 1800);
  } catch (err) {
    alert('تعذّر النسخ التلقائي، انسخ النص يدويًا.');
  }
});
</script>
</body>
</html>
