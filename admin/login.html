<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | لوحة تحكم عيادة تحدث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
  body{background:#EFEDE6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:#fff; padding:44px 36px; border-radius:20px; box-shadow:0 20px 50px rgba(34,50,44,.12); width:100%; max-width:380px;}
  h1{font-size:1.5rem; color:#22322C; margin-bottom:6px; text-align:center;}
  p.sub{text-align:center; color:#6b7570; font-size:.9rem; margin-bottom:28px;}
  label{display:block; font-size:.88rem; font-weight:700; color:#22322C; margin-bottom:6px;}
  input{width:100%; padding:12px 14px; border:1px solid #DAD5C8; border-radius:10px; margin-bottom:18px; font-size:.95rem;}
  input:focus{outline:2px solid #B8734F; border-color:transparent;}
  button{width:100%; padding:13px; background:#22322C; color:#fff; border:none; border-radius:10px; font-weight:700; font-size:.95rem; cursor:pointer;}
  button:hover{background:#B8734F;}
  .msg{color:#B8734F; font-size:.85rem; margin-bottom:14px; min-height:18px; text-align:center;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>لوحة تحكم عيادة تحدث</h1>
    <p class="sub">سجّل الدخول لإدارة الموقع</p>
    <div class="msg" id="msg"></div>
    <label for="name">الاسم</label>
    <input type="text" id="name" required>
    <label for="password">كلمة المرور</label>
    <input type="password" id="password" required>
    <button type="submit">دخول</button>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const res = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name: document.getElementById('name').value, password: document.getElementById('password').value })
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error || 'حدث خطأ'; return; }
  location.href = data.mustChangePassword ? '/admin/change-password.html' : '/admin/dashboard.html';
});
</script>
</body>
</html>
