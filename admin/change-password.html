<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة المرور | عيادة تحدث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Tajawal',sans-serif;}
  body{background:#EFEDE6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{background:#fff; padding:44px 36px; border-radius:20px; box-shadow:0 20px 50px rgba(34,50,44,.12); width:100%; max-width:400px;}
  h1{font-size:1.4rem; color:#22322C; margin-bottom:6px; text-align:center;}
  p.sub{text-align:center; color:#6b7570; font-size:.9rem; margin-bottom:28px;}
  label{display:block; font-size:.88rem; font-weight:700; color:#22322C; margin-bottom:6px;}
  input{width:100%; padding:12px 14px; border:1px solid #DAD5C8; border-radius:10px; margin-bottom:18px; font-size:.95rem;}
  button{width:100%; padding:13px; background:#22322C; color:#fff; border:none; border-radius:10px; font-weight:700; font-size:.95rem; cursor:pointer;}
  button:hover{background:#B8734F;}
  .msg{color:#B8734F; font-size:.85rem; margin-bottom:14px; min-height:18px; text-align:center;}
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>هذا أول دخول لك</h1>
    <p class="sub">الرجاء تعيين كلمة مرور جديدة وخاصة بك (8 أحرف على الأقل)</p>
    <div class="msg" id="msg"></div>
    <label for="p1">كلمة المرور الجديدة</label>
    <input type="password" id="p1" required minlength="8">
    <label for="p2">تأكيد كلمة المرور</label>
    <input type="password" id="p2" required minlength="8">
    <button type="submit">حفظ ومتابعة</button>
  </form>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('msg');
  const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  if (p1 !== p2) { msg.textContent = 'كلمتا المرور غير متطابقتين'; return; }
  const res = await fetch('/api/auth/change-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ newPassword: p1 }) });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error || 'حدث خطأ'; return; }
  location.href = '/admin/dashboard.html';
});
</script>
</body>
</html>
